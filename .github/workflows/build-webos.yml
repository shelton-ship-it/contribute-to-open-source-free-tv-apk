name: Build LG webOS (.ipk)

# Empacota tv/webos/ (wrapper fino, mesmo padrão do Tizen) como .ipk para
# LG webOS TV. ares-cli via npm — sem certificados/secrets: .ipk para
# sideload/teste não precisa de assinatura (só a LG Content Store exigiria).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tv/webos/**'
      - '.github/workflows/build-webos.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar webOS ares-cli
        run: npm install -g @webosose/ares-cli

      - name: Package (.ipk)
        run: ares-package tv/webos -o tv/webos/out

      - uses: actions/upload-artifact@v4
        with:
          name: pixgo-webos-ipk
          path: tv/webos/out/*.ipk
          if-no-files-found: warn
