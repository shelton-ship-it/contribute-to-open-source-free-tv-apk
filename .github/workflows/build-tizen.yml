name: Build Samsung Tizen (.wgt)

# Empacota tv/tizen/ (wrapper fino que carrega www.pixgo.qzz.io — regra 10/13
# do plano, não duplica a app) como widget .wgt para Samsung Tizen TV.
#
# Tizen Studio 5.6 (não 6.x): a 6.1 tem um bug confirmado e por resolver da
# própria Samsung — "tizen build-web" falha sempre com NoClassDefFoundError
# org.eclipse.core.runtime.Plugin (github.com/Samsung/tizen-docs#2100,
# "funcionava no 6.0, quebrou no 6.1"). A 5.6 é a versão usada num workflow
# real em produção (reisxd/TizenBrew) — instalação em $GITHUB_WORKSPACE
# (sempre escrevível, ao contrário de /opt) e certificado de autor gerado
# no próprio runner, sem secrets novos.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tv/tizen/**'
      - '.github/workflows/build-tizen.yml'

env:
  TIZEN_STUDIO_VER: '5.6'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Tizen Studio CLI (headless)
        run: |
          curl -sSL -o /tmp/tizen-studio.bin \
            "https://download.tizen.org/sdk/Installer/tizen-studio_${TIZEN_STUDIO_VER}/web-cli_Tizen_Studio_${TIZEN_STUDIO_VER}_ubuntu-64.bin"
          chmod +x /tmp/tizen-studio.bin
          # Caminho posicional (sem -o, essa flag não existe neste instalador)
          # dentro de $GITHUB_WORKSPACE — sempre escrevível pelo runner,
          # ao contrário de /opt ("Invalid the destination directory").
          /tmp/tizen-studio.bin --accept-license "$GITHUB_WORKSPACE/tizen-studio"
          echo "$GITHUB_WORKSPACE/tizen-studio/tools/ide/bin" >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/tizen-studio/tools" >> "$GITHUB_PATH"

      - name: Verificar instalação
        run: |
          which tizen || (echo "ERRO: binário 'tizen' não encontrado no PATH — ver diagnóstico do passo anterior" && exit 1)
          tizen version

      - name: Gerar certificado de autor (self-signed, único para este build)
        run: |
          tizen certificate -a pixgo-tv -p pixgotv2026 -c MZ -s Maputo -ct Maputo -o Pixgo -n "Pixgo TV" -e support@pixgo.qzz.io -f pixgo-author

      # "tizen security-profiles add" tem um bug antigo e documentado
      # (developer.tizen.org/forums, várias versões desde 2018): grava a
      # password como referência a um ficheiro .pwd que nunca chega a ser
      # criado, e o "package" falha sempre com "Invalid password" ao tentar
      # lê-la de volta — foi exactamente o erro visto no log. A correção
      # confirmada (usada em projectos reais de apps de TV) é escrever o
      # profiles.xml à mão, com a password em texto simples inline, usando
      # o certificado distribuidor por omissão que já vem com o Tizen
      # Studio — a sua password é fixa e pública, documentada em vários
      # projectos: "tizenpkcs12passfordsigner".
      - name: Escrever profiles.xml directamente (evita o bug do security-profiles add)
        run: |
          TSDATA="$GITHUB_WORKSPACE/tizen-studio-data"
          TSDIR="$GITHUB_WORKSPACE/tizen-studio"
          mkdir -p "$TSDATA/profile"
          cat > "$TSDATA/profile/profiles.xml" << XMLEOF
          <?xml version="1.0" encoding="UTF-8" standalone="no"?>
          <profiles active="pixgo-tv" version="3.1">
          <profile name="pixgo-tv">
          <profileitem ca="$TSDIR/tools/certificate-generator/certificates/developer/tizen-developer-ca.cer" distributor="0" key="$TSDATA/keystore/author/pixgo-author.p12" password="pixgotv2026" rootca=""/>
          <profileitem ca="$TSDIR/tools/certificate-generator/certificates/distributor/tizen-distributor-ca.cer" distributor="1" key="$TSDIR/tools/certificate-generator/certificates/distributor/tizen-distributor-signer.p12" password="tizenpkcs12passfordsigner" rootca=""/>
          <profileitem ca="" distributor="2" key="" password="" rootca=""/>
          </profile>
          </profiles>
          XMLEOF
          tizen cli-config "profiles.path=$TSDATA/profile/profiles.xml"
          cat "$TSDATA/profile/profiles.xml"

      - name: Build + Package (.wgt)
        working-directory: tv/tizen
        run: |
          # working-directory já é tv/tizen — sem prefixar o caminho outra
          # vez (o "-- tv/tizen -out tv/tizen/.buildResult" anterior
          # resolvia .buildResult DENTRO do próprio tv/tizen, duplicando o
          # caminho: tv/tizen/tv/tizen/.buildResult — daí o package
          # seguinte nunca encontrar a pasta certa).
          tizen build-web -out .buildResult
          tizen package -t wgt -s pixgo-tv -o out -- .buildResult

      - name: Mostrar log do Tizen CLI em caso de falha
        if: failure()
        run: |
          echo "--- tizen-studio-data/cli/logs/cli.log ---"
          cat "$GITHUB_WORKSPACE/tizen-studio-data/cli/logs/cli.log" 2>/dev/null || echo "(log não encontrado nesse caminho)"
          find "$GITHUB_WORKSPACE/tizen-studio-data" -iname "*.log" -exec sh -c 'echo "--- {} ---"; cat "{}"' \; 2>/dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: pixgo-tizen-wgt
          path: tv/tizen/out/*.wgt
          if-no-files-found: warn
