name: Build Android TV (TWA/Bubblewrap)

# Empacota o site já publicado (www.pixgo.qzz.io) como TWA para Android TV,
# Google TV, Fire TV e TV Box — mesma APK serve os quatro, todos Android.
# Não usa nenhuma credencial nova: a keystore é a que está commitada em
# tv/android/android.keystore (self-signed, gerada uma única vez, senha em
# tv/android/twa-manifest.json) — suficiente para sideload/instalação
# directa, que é o que estas plataformas usam.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tv/android/**'
      - '.github/workflows/build-android-tv.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      # Sem isto, "bubblewrap build" pergunta interativamente "queres que eu
      # instale o JDK?" (sem terminal em CI, isso mata o processo — exit 130
      # visto no log). Aponta directamente para o JDK/SDK já instalados nos
      # passos anteriores, evitando a pergunta.
      - name: Configurar Bubblewrap (usar JDK/SDK já instalados)
        run: |
          # O setup-android instala em cmdline-tools/<versão> (ex.: 16.0),
          # não em cmdline-tools/latest — mas a validação do Bubblewrap
          # exige especificamente esse nome ("androidSdk isn't correct"
          # mesmo com o SDK real lá instalado). Cria o link em falta.
          if [ ! -e "$ANDROID_HOME/cmdline-tools/latest" ]; then
            VER_DIR=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/ 2>/dev/null | grep -v latest | head -n1)
            ln -s "$VER_DIR" "$ANDROID_HOME/cmdline-tools/latest"
          fi
          # Confirmado no código-fonte do Bubblewrap (AndroidSdkTools.validatePath):
          # exige <SDK>/tools OU <SDK>/bin na RAIZ do SDK — não cmdline-tools/latest.
          # SDKs modernos (cmdline-tools-only) não têm nenhum dos dois por omissão,
          # daí o "The provided androidSdk isn't correct" mesmo com o SDK real lá.
          if [ ! -e "$ANDROID_HOME/bin" ]; then
            ln -s cmdline-tools/latest/bin "$ANDROID_HOME/bin"
          fi
          mkdir -p "$HOME/.bubblewrap"
          cat > "$HOME/.bubblewrap/config.json" << CFGEOF
          {
            "jdkPath": "${JAVA_HOME}",
            "androidSdkPath": "${ANDROID_HOME}"
          }
          CFGEOF
          cat "$HOME/.bubblewrap/config.json"
          ls -la "$ANDROID_HOME/cmdline-tools/"

      # twa-manifest.json e android.keystore já estão commitados em
      # tv/android/ — build não-interactivo, sem prompts.
      - name: Build TWA (APK + AAB)
        working-directory: tv/android
        run: |
          bubblewrap build --skipPwaValidation

      - uses: actions/upload-artifact@v4
        with:
          name: pixgo-android-tv
          path: |
            tv/android/app-release-signed.apk
            tv/android/app-release-bundle.aab
          if-no-files-found: warn
